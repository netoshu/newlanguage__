<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#030305"><title>newlanguage_ — Gesture Studio</title><link rel="stylesheet" href="src/style.css"></head><body><header><strong>newlanguage_</strong><span>GESTURE STUDIO / WEB</span><span id="status">APP / STARTING</span></header><main><canvas id="stage"></canvas></main><section class="hud"><div class="emotion"><small>EMOTION</small><b id="emotion">IDLE</b></div><div class="meter"><small id="intensityText">INTENSITY 0.00</small><div><i id="intensity"></i></div></div><div class="sticks"><small>L STICK</small><b id="leftData">0.00 / 0.00</b><small>R STICK</small><b id="rightData">0.00 / 0.00</b></div><div class="controls"><button id="record">● RECORD</button><button id="export">EXPORT JSON</button><button id="exportCsv">EXPORT CSV</button><button id="look">LOOK: GRADIENT</button></div></section><footer><span>WEB / 60 FPS VISUAL ENGINE</span><span id="timer">00:00.000</span><span>newlanguage_</span></footer><script>
window.addEventListener('error', function(e) {
  const s = document.getElementById('status');
  if (s) s.textContent = 'APP ERROR / ' + (e.message || 'script failed').slice(0, 65) + ' / ' + (e.filename ? e.filename.split('/').pop() : 'unknown') + ':' + (e.lineno || 0);
});
window.addEventListener('unhandledrejection', function(e) {
  const s = document.getElementById('status');
  if (s) s.textContent = 'APP ERROR / ' + String(e.reason && e.reason.stack || e.reason || 'module failed').slice(0, 110);
});
</script><script type="module" src="src/app.js?v=0e3e1f3"></script></body></html>
