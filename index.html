<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>newlanguage_</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f5f2;
      color: #171717;
    }
    main {
      width: min(900px, 100%);
      padding: 48px 28px;
    }
    .eyebrow {
      margin: 0 0 18px;
      font-size: 13px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #737373;
    }
    h1 {
      margin: 0;
      font-size: clamp(64px, 13vw, 150px);
      line-height: .88;
      letter-spacing: -.07em;
      font-weight: 700;
    }
    .rule {
      width: 100%;
      height: 1px;
      margin: 32px 0 20px;
      background: #171717;
    }
    p {
      max-width: 520px;
      margin: 0;
      font-size: 18px;
      line-height: 1.5;
      color: #525252;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A new language</p>
    <h1>newlanguage_</h1>
    <div class="rule"></div>
    <p>A simple starting point for exploring a new way of expressing ideas through code.</p>
  </main>
</body>
</html>
